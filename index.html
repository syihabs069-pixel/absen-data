
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen Digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Absen Digital</h2>
    <input type="text" id="nama" placeholder="Masukkan Nama">
    <button onclick="submitAbsen()">Absen</button>
  </div>

  <!-- SCRIPT NORMAL (TOMBOL) -->
  <script>
    function submitAbsen() {
      alert("TOMBOL TERKLIK"); // TEST (boleh dihapus nanti)

      const nama = document.getElementById("nama").value;
      if (nama === "") {
        alert("Nama wajib diisi");
        return;
      }

      kirimAbsen(nama);
    }
  </script>

  <!-- SCRIPT FIREBASE (WAJIB TERPISAH) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔥 GANTI SEMUA ISI DI BAWAH INI DENGAN PUNYA KAMU 🔥
    const firebaseConfig = {
  apiKey: "AIzaSyCEXAIyv9fmgz4jGJq36FrE4GuXyZ2DjyE",
  authDomain: "absen-online-d94b2.firebaseapp.com",
  projectId: "absen-online-d94b2",
  storageBucket: "absen-online-d94b2.firebasestorage.app",
  messagingSenderId: "640002598760",
  appId: "1:640002598760:web:fe0b388e74f45422a9d8dd",
  measurementId: "G-C0NM7N6L88"
};
    // 🔥 SAMPAI SINI SAJA YANG DIGANTI 🔥

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.kirimAbsen = async function (nama) {
      try {
        await addDoc(collection(db, "absen"), {
          nama: nama,
          waktu: new Date()
        });
        alert("ABSEN MASUK FIREBASE ✅");
      } catch (e) {
        alert("ERROR: " + e.message);
      }
    };
  </script>

</body>
</html>
