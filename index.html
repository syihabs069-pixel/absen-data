<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen Digital</title>
<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  background: white;
  padding: 20px;
  width: 320px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}
video {
  width: 100%;
  margin-top: 10px;
  border-radius: 8px;
}
button {
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
</head>
<body>

<div class="box">
  <h3>Absen Digital</h3>

  <input id="nama" placeholder="Nama">
  <input id="pekerjaan" placeholder="Pekerjaan">

  <video id="video" autoplay></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <button onclick="ambilFoto()">Ambil Foto</button>
  <button onclick="submitAbsen()">Absen</button>
</div>

<!-- SCRIPT UI -->
<script>
let fotoBlob = null;

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById("video").srcObject = stream;
  } catch (e) {
    alert("Kamera ditolak ❌");
  }
}
startCamera();

function ambilFoto() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    fotoBlob = blob;
    alert("Foto siap 📸");
  });
}

function submitAbsen() {
  const nama = document.getElementById("nama").value;
  const pekerjaan = document.getElementById("pekerjaan").value;

  if (!nama || !pekerjaan || !fotoBlob) {
    alert("Lengkapi nama, pekerjaan, dan foto");
    return;
  }

  kirimAbsen(nama, pekerjaan, fotoBlob);
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

,* 🔥 GANTI INI SAJA 🔥 */
const firebaseConfig = {
  apiKey: "AIzaSyCEXAIyv9fmgz4jGJq36FrE4GuXyZ2DjyE",
  authDomain: "absen-online-d94b2.firebaseapp.com",
  projectId: "absen-online-d94b2",
  storageBucket: "absen-online-d94b2.firebasestorage.app",
  messagingSenderId: "640002598760",
  appId: "1:640002598760:web:fe0b388e74f45422a9d8dd",
  measurementId: "G-C0NM7N6L88"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.kirimAbsen = async function(nama, pekerjaan, fotoBlob) {
  try {
    const fotoRef = ref(storage, "absen/" + Date.now() + ".jpg");
    await uploadBytes(fotoRef, fotoBlob);
    const fotoUrl = await getDownloadURL(fotoRef);

    await addDoc(collection(db, "absen"), {
      nama,
      pekerjaan,
      fotoUrl,
      waktu: new Date()
    });

    alert("ABSEN + FOTO BERHASIL ✅");
  } catch (e) {
    alert("ERROR: " + e.message);
  }
};
</script>

</body>
</html>
